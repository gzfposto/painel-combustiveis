name: Atualizar painel

on:
  schedule:
    # Horários em UTC. Brasília = UTC-3 (sem horário de verão desde 2019).
    - cron: "0 11 * * *"   # 08:00 em Brasília
    - cron: "0 21 * * *"   # 18:00 em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths-ignore: ["dados/**"]   # evita rodar de novo quando o robô salva os dados

permissions:
  contents: write   # salvar o histórico (dados/) no repositório
  pages: write      # publicar no GitHub Pages
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar dados e gerar a página
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m painel.main

      - name: Salvar histórico no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
